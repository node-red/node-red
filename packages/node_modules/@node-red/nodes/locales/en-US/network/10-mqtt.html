<script type="text/html" data-help-name="mqtt in">
<p>Connects to a MQTT broker and subscribes to messages from the specified topic.</p>
    <h3>Outputs</h3>
    <dl class="message-properties">
       <dt>payload <span class="property-type">string | buffer</span></dt>
       <dd>a string unless detected as a binary buffer.</dd>
       <dt>topic <span class="property-type">string</span></dt>
       <dd>the MQTT topic, uses / as a hierarchy separator.</dd>
       <dt>qos <span class="property-type">number</span> </dt>
       <dd>0, fire and forget - 1, at least once - 2, once and once only.</dd>
       <dt>retain <span class="property-type">boolean</span></dt>
       <dd>true indicates the message was retained and may be old.</dd>

       <dt class="optional">responseTopic <span class="property-type">string</span></dt>
       <dd><b>MQTTv5</b>: the MQTT response topic for the message</dd>
       <dt class="optional">correlationData <span class="property-type">Buffer</span></dt>
       <dd><b>MQTTv5</b>: the correlation data for the message</dd>
       <dt class="optional">contentType <span class="property-type">string</span></dt>
       <dd><b>MQTTv5</b>: the content-type of the payload</dd>
       <dt class="optional">userProperties <span class="property-type">object</span></dt>
       <dd><b>MQTTv5</b>: any user properties of the message</dd>
       <dt class="optional">messageExpiryInterval <span class="property-type">number</span></dt>
       <dd><b>MQTTv5</b>: the expiry time, in seconds, of the message</dd>
    </dl>
    <h3>Details</h3>
    The subscription topic can include MQTT wildcards, + for one level, # for multiple levels.</p>
    <p>This node requires a connection to a MQTT broker to be configured. This is configured by clicking
    the pencil icon.</p>
    <p>Several MQTT nodes (in or out) can share the same broker connection if required.</p>
    <h4>Dynamic Subscription</h4>
    The node can be configured to dynamically control the MQTT connection and its subscriptions. When
    enabled, the node will have an input and can be controlled by passing it messages.
    <h3>Inputs</h3>
    <p>These only apply when the node has been configured for dynamic subscriptions.</p>
    <dl class="message-properties">
       <dt>action <span class="property-type">string</span></dt>
       <dd>the name of the action the node should perform. Available actions are: <code>"connect"</code>,
       <code>"disconnect"</code>, <code>"getSubscriptions"</code>, <code>"subscribe"</code> and 
       <code>"unsubscribe"</code>.</dd>
       <dt class="optional">topic <span class="property-type">string|object|array</span></dt>
       <dd>For the <code>"subscribe"</code> and <code>"unsubscribe"</code> actions, this property
           provides the topic. It can be set as either:<ul>
           <li>a String containing the topic filter</li>
           <li>an Object containing <code>topic</code> and <code>qos</code> properties</li>
           <li>an array of either strings or objects to handle multiple topics in one</li>
            </ul>
        </dd>
       <dt class="optional">broker <span class="property-type">broker</span> </dt>
       <dd>For the <code>"connect"</code> action, this property can override any
           of the individual broker configuration settings, including: <ul>
               <li><code>broker</code></li>
               <li><code>port</code></li>
               <li><code>url</code> - overrides broker/port to provide a complete connection url</li>
               <li><code>username</code></li>
               <li><code>password</code></li>
           </ul>
           <p>If this property is set and the broker is already connected an error
              will be logged unless it has the <code>force</code> property set - in which case it will
              disconnect from the broker, apply the new settings and reconnect.</p>
       </dd>
    </dl>

</script>

<script type="text/html" data-help-name="mqtt out">
    <p>Connects to a MQTT broker and publishes messages.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
       <dt>payload <span class="property-type">string | buffer</span></dt>
       <dd> the payload to publish. If this property is not set, no message will be sent. To send a blank message, set this property to an empty String.</dd>
       <dt class="optional">topic <span class="property-type">string</span></dt>
       <dd> the MQTT topic to publish to.</dd>
       <dt class="optional">qos <span class="property-type">number</span></dt>
       <dd>0, fire and forget - 1, at least once - 2, once and once only. Default 0.</dd>
       <dt class="optional">retain <span class="property-type">boolean</span></dt>
       <dd>set to true to retain the message on the broker. Default false.</dd>
       <dt class="optional">responseTopic <span class="property-type">string</span></dt>
       <dd><b>MQTTv5</b>: the MQTT response topic for the message</dd>
       <dt class="optional">correlationData <span class="property-type">Buffer</span></dt>
       <dd><b>MQTTv5</b>: the correlation data for the message</dd>
       <dt class="optional">contentType <span class="property-type">string</span></dt>
       <dd><b>MQTTv5</b>: the content-type of the payload</dd>
       <dt class="optional">userProperties <span class="property-type">object</span></dt>
       <dd><b>MQTTv5</b>: any user properties of the message</dd>
       <dt class="optional">messageExpiryInterval <span class="property-type">number</span></dt>
       <dd><b>MQTTv5</b>: the expiry time, in seconds, of the message</dd>
       <dt class="optional">topicAlias <span class="property-type">number</span></dt>
       <dd><b>MQTTv5</b>: the MQTT topic alias to use</dd>
    </dl>
    <h3>Details</h3>
    <code>msg.payload</code> is used as the payload of the published message.
    If it contains an Object it will be converted to a JSON string before being sent.
    If it contains a binary Buffer the message will be published as-is.</p>
    <p>The topic used can be configured in the node or, if left blank, can be set by <code>msg.topic</code>.</p>
    <p>Likewise the QoS and retain values can be configured in the node or, if left
    blank, set by <code>msg.qos</code> and <code>msg.retain</code> respectively. To clear a previously
    retained topic from the broker, send a blank message to that topic with the retain flag set.</p>
    <p>This node requires a connection to a MQTT broker to be configured. This is configured by clicking
    the pencil icon.</p>
    <p>Several MQTT nodes (in or out) can share the same broker connection if required.</p>

    <h4>Dynamic Control</h4>
    The connection shared by the node can be controlled dynamically. If the node receives
    one of the following control messages, it will not publish the message payload as well.
    <h3>Inputs</h3>
    <dl class="message-properties">
       <dt>action <span class="property-type">string</span></dt>
       <dd>the name of the action the node should perform. Available actions are: <code>"connect"</code>,
       and <code>"disconnect"</code>.</dd>
       <dt class="optional">broker <span class="property-type">broker</span> </dt>
       <dd>For the <code>"connect"</code> action, this property can override any
           of the individual broker configuration settings, including: <ul>
               <li><code>broker</code></li>
               <li><code>port</code></li>
               <li><code>url</code> - overrides broker/port to provide a complete connection url</li>
               <li><code>username</code></li>
               <li><code>password</code></li>
           </ul>
           <p>If this property is set and the broker is already connected an error
              will be logged unless it has the <code>force</code> property set - in which case it will
              disconnect from the broker, apply the new settings and reconnect.</p>
       </dd>
    </dl>

</script>

<script type="text/markdown" data-help-name="mqtt request">
MQTT Request node connects to a MQTT broker and publishes messages, then waits for a response on the specified response topic.

### Inputs

: payload (string|Object|Buffer)    :  the payload of the message to publish.
: *topic* (string)                  :  the MQTT topic to publish to. Can be a static string, an Env Var, or set dynamically by a `msg` property e.g `msg.topic`.
: *responseTopic* (string)          :  the MQTT topic to wait for a response on. Can be a static string, an Env Var, or set dynamically by a `msg` property e.g `msg.responseTopic`.
: *correlationData* (string|Buffer) :  the correlation data to use for the request. This is used to match the response to the request. By default, this is an autogenerated UUID but can be provided dynamically by a `msg` property e.g `msg.correlationData`.
: *qos* (number)                    :  0, fire and forget - 1, at least once - 2, once and once only. Default `1`.
: *messageExpiryInterval* (number)  :  how long (in seconds) to wait for a response before the request times out. Default `5`. This can also be set dynamically by a `msg` property e.g `msg.messageExpiryInterval`.


### Outputs

1. Standard output
: payload (string|Object|Buffer) : the value of the response message. The type depends on the output type selected in the node configuration.
: topic (string) : the MQTT topic on which the response was received.
: requestTopic (string) : the MQTT topic on which the request was sent.
: correlationData (Buffer) : the correlation data of the response message that was matched to the request.
: qos (number) : the QoS of the response message.
: retain (boolean) : the retain flag of the response message.
: *contentType* (string) : the content type of the response message.
: *userProperties* (object) : any user properties of the response message.

On timeout or failure the node does not emit on this output; instead it reports an error (see Details).


### Details

> [!WARNING]
> The MQTT Request node requires a broker that supports MQTT v5.0 or later.

`msg.payload` is used as the payload of the published message.
If it contains an Object it will be converted to a JSON string before being sent.
If it contains a binary Buffer the message will be published as-is.

Additional v5 properies can be set in the msg and will be passed to the broker when publishing the request message. These include:
* `msg.contentType` - the content type of the payload
* `msg.userProperties` - any user properties of the message

The incoming message is passed through to the output: all of its **non-MQTT** properties (including `req`/`res`, `_linkSource`, `_msgid` and any of your own) are retained.
The MQTT message properties are replaced with those of the response (or cleared if the response does not include them):
* `msg.payload` - the payload of the response message
* `msg.topic` - the MQTT topic on which the response was received
* `msg.requestTopic` - the topic the request was published to (for convenience)
* `msg.qos` / `msg.retain` - the QoS and retain flag of the response
* `msg.correlationData` - the correlation data of the response, matched to the request
* `msg.contentType` - the content type of the response message
* `msg.userProperties` - any user properties of the response message
* other standard MQTT v5 message properties (e.g. `responseTopic`, `messageExpiryInterval`, `payloadFormatIndicator`)

#### Timeouts and errors
The timeout is measured from when the message is received and covers the whole exchange (subscribe, publish and
waiting for the response), so the node always produces exactly one outcome - a response or an error - within the
timeout, even if the broker connection is half-open.

If no matching response arrives in time (or the request cannot be sent), the node reports an error. The original
input message is passed to any catch node, with a `msg.mqtt` object describing the outcome:
* `msg.mqtt.timedOut` (boolean) - always `true` for a timeout
* `msg.mqtt.qos` (number) - the QoS the request was published at
* `msg.mqtt.delivered` (boolean) - `true` if publishing was confirmed before the timeout. For QoS 1/2 this means
  the broker acknowledged receipt; for QoS 0 it only means the packet was written to the connection.

Use `msg.mqtt.delivered` to decide whether a retry is safe: when `false`, the request was not confirmed sent (and,
for QoS 1/2, is purged from the client's outgoing store so it will not be re-sent on reconnect).

> [!NOTE]
> When `msg.mqtt.delivered` is `true` the broker already had the request, so a retry may cause the responder to process it
> twice - this is inherent to at-least-once delivery. A QoS 0 message that was queued while offline cannot be
> purged and may still be sent on reconnect.

> [!TIP]
> To keep an input value in the output, copy it to a non-MQTT property name (e.g. `msg._keep`) before this node.
> Anything outside the MQTT message properties (`payload`, `topic`, `qos`, `retain`, `responseTopic`, `correlationData`, `contentType`, `userProperties`, ...) is passed through; those listed will be overwritten by the response.


#### Recommended Usage
* Where feasible, use the Auto Generated Correlation Data option to ensure that each request has a unique correlation data value. This will help avoid any inflight request collisions and ensure that responses are matched to the correct request.
* If you need to use a static correlation data value, ensure that you are not sending multiple requests with the same correlation data value at the same time.
* Where feasible, avoid dynamic "Response Topic" since subscribing upon request has an overhead that is otherwise avoidable with a static response topic.


#### Dynamic Control
The connection shared by the node can be controlled dynamically. If the node receives
one of the following control messages, it performs the action instead of publishing a request.
: `action` (string)  : the name of the action the node should perform. Available actions are: `"connect"`, and `"disconnect"`.
: `broker` (broker) : For the `"connect"` action, this property can override any
of the individual broker configuration settings, including:
* `broker`
* `port`
* `url` - overrides broker/port to provide a complete connection url
* `username`
* `password`

> [!NOTE]
> If the `msg.broker` property is set and the existing broker is already connected an error will be logged unless it has the `force` property set - in which case it will disconnect from the broker, apply the new settings and reconnect.
</script>

<script type="text/html" data-help-name="mqtt-broker">
    <p>Configuration for a connection to an MQTT broker.</p>
    <p>This configuration will create a single connection to the broker which can
       then be reused by <code>MQTT In</code> and <code>MQTT Out</code> nodes.</p>
    <p>The node will generate a random Client ID if one is not set and the
       node is configured to use a Clean Session connection. If a Client ID is set,
       it must be unique to the broker you are connecting to.</p>
    <h4>Birth Message</h4>
    <p>This is a message that will be published on the configured topic whenever the
       connection is established.</p>
    <h4>Close Message</h4>
    <p>This is a message that will be published on the configured topic before the
       connection is closed normally, either by re-deploying the node, or by shutting down.</p>
    <h4>Will Message</h4>
    <p>This is a message that will be published by the broker in the event the node
       unexpectedly loses its connection.</p>
    <h4>WebSockets</h4>
    <p>The node can be configured to use a WebSocket connection. To do so, the Server
       field should be configured with a full URI for the connection. For example:</p>
    <pre>ws://example.com:4000/mqtt</pre>

</script>
